name: Release

on:
  push:
    branches:
      - master # Triggers on push to master branch
    tags:
      - 'v*' # Triggers when a tag starting with v is pushed (e.g. v1.0.0)
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write # Required for creating releases

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout CallRecording
      uses: actions/checkout@v4
      with:
        path: CallRecording

    - name: Checkout MySharedProject
      uses: actions/checkout@v4
      with:
        repository: 1592363624/MySharedProject
        path: MySharedProject
        token: ${{ secrets.MY_PAT }} # Required if MySharedProject is private 

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore CallRecording/CallRecording.csproj

    - name: Build
      run: dotnet build CallRecording/CallRecording.csproj --configuration Release --no-restore

    - name: Publish
      run: dotnet publish CallRecording/CallRecording.csproj --configuration Release --no-build --output ./publish

    - name: Zip Release
      run: Compress-Archive -Path ./publish/* -DestinationPath ./CallRecording.zip

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: CallRecording.zip
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

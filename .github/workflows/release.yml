name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout CallRecording
        uses: actions/checkout@v4
        with:
          path: CallRecording

      - name: Checkout MySharedProject
        uses: actions/checkout@v4
        with:
          repository: 1592363624/MySharedProject
          path: MySharedProject
          token: ${{ secrets.MY_PAT }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version from csproj
        id: get_version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content "CallRecording/CallRecording.csproj"
          $version = $csproj.Project.PropertyGroup.AssemblyVersion
          
          if (-not $version) {
            Write-Error "未在 csproj 中找到 AssemblyVersion"
            exit 1
          }
          
          Write-Host "当前版本号: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore CallRecording/CallRecording.csproj

      - name: Build
        run: dotnet build CallRecording/CallRecording.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish CallRecording/CallRecording.csproj --configuration Release --no-build --output ./publish

      - name: Zip Release
        run: Compress-Archive -Path ./publish/* -DestinationPath ./CallRecording.zip

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: CallRecording.zip
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
